spring.application.name=practicalocalidades

# Propiedades propias de la práctica (no son de Spring, las he puesto yo).
# En el código se leen con @Value, así no hay rutas escritas a mano dentro de las clases.

# Carpeta donde está el fichero de clientes
batch.ruta.entrada=datos/entrada

# Nombre del fichero de clientes que se procesa.
# Para probar con otro fichero (por ejemplo clientes_prueba.csv) solo hay que cambiar esta línea.
batch.fichero=clientes.csv
